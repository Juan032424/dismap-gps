name: Desplegar a produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 167.148.33.153
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/dismap-gps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || {
            echo "::error::La llave privada en el secreto DEPLOY_SSH_KEY no es valida (revisa que se haya pegado completa, incluyendo las lineas BEGIN/END)."
            exit 1
          }
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Sincronizar codigo al servidor
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='.env' --exclude='dist' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Reconstruir y reiniciar contenedores
        run: |
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            cd $DEPLOY_PATH &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            docker image prune -f
          "
