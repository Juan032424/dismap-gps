services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: dismap-db
    environment:
      POSTGRES_PASSWORD: cambiame
      POSTGRES_DB: dismap
    ports:
      - "5433:5432"   # 5433 en el PC para no chocar con un PostgreSQL de Windows
    volumes:
      - dbdata:/home/postgres/pgdata/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: dismap-redis
    ports:
      - "6379:6379"

volumes:
  dbdata:
